<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/loginStyles.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <main class="auth-card">
      <div class="auth-topbar">
        <button class="back-home-btn" type="button" onclick="window.location.href='../index.html'">Volver al inicio</button>
      </div>

      <header class="auth-header">
        <h1 class="auth-title">Registrarse</h1>
        <p class="auth-subtitle">¡Crea tu perfil!</p>
      </header>

      <form class="auth-form" id="logon-form">
        <div class="field-group">
          <label class="field-label" for="nickname">Nickname</label>
          <input class="field-input" type="text" id="nickname" name="nickname" placeholder="Tu nombre de jugador" autocomplete="nickname" required>
          <small class="field-hint">Ingresa un nickname</small>
        </div>

        <div class="field-group">
          <label class="field-label" for="email">Correo</label>
          <input class="field-input" type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="email" required>
          <small class="field-hint">Usa el correo que quieres vincular a tu cuenta.</small>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Contraseña</label>
          <div class="password-row">
            <input class="password-input" type="password" id="password" name="password" placeholder="Ingresa tu contrasena" autocomplete="new-password" required>
            <button class="peek-password-btn" type="button" id="peek-password">Ver</button>
          </div>
        </div>

        <button class="auth-submit" type="submit">Registrarse</button>
        <div class="auth-link-row">
          <a class="auth-link" href="./LogIn.html">¿Ya tienes cuenta?</a>
        </div>
      </form>
    </main>
  </div>

  <script src="logOnAction.js"></script>
</body>
</html>
