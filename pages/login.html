<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de sesión</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/loginStyles.css">
  <link rel="stylesheet" href="../css/messageStyles.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <main class="auth-card">
      <div class="auth-topbar">
        <button class="back-home-btn" type="button" onclick="window.location.href='../index.html'">Volver al inicio</button>
      </div>

      <header class="auth-header">
        <h1 class="auth-title">Inicia sesión</h1>
        <p class="auth-subtitle">¡Bienvenido de nuevo!</p>
      </header>

      <form class="auth-form" id="login-form" novalidate>
        <div class="field-group">
          <label class="field-label" for="email">Correo</label>
          <input class="field-input" type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="off">
          <small class="field-hint" id="email-error"></small>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Contraseña</label>
          <div class="password-row">
            <input class="password-input" type="password" id="password" name="password" placeholder="Ingresa tu contraseña" autocomplete="off">
            <button class="peek-password-btn" type="button" id="peek-password">Ver 3 seg</button>
          </div>
          <small class="field-hint" id="password-error"></small>
        </div>

        <button class="auth-submit" type="submit">Entrar</button>
        <div class="auth-link-row">
          <a class="auth-link" href="./logOn.html">¿No tienes cuenta? Regístrate</a>
        </div>
      </form>
    </main>
  </div>

  <script src="../data/authGuard.js"></script>
  <script src="../messages/authMessages.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const peekButton = document.getElementById('peek-password');
    const loginForm = document.getElementById('login-form');
    let hidePasswordTimeout;

    window.addEventListener('load', () => {
      loginForm.reset();
      redirectIfAuth();
    });

    peekButton.addEventListener('click', () => {
      clearTimeout(hidePasswordTimeout);
      passwordInput.type = 'text';
      peekButton.textContent = 'Visible';

      hidePasswordTimeout = window.setTimeout(() => {
        passwordInput.type = 'password';
        peekButton.textContent = 'Ver 3 seg';
      }, 3000);
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const emailInput = document.getElementById('email');
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');
      emailError.textContent = '';
      passwordError.textContent = '';

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email) {
        emailError.textContent = 'El correo es requerido';
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailError.textContent = 'Ingresa un correo válido (ejemplo@dominio.com)';
        return;
      }

      if (!password) {
        passwordError.textContent = 'La contraseña es requerida';
        return;
      }

      const formData = new FormData();
      formData.append('e_mail', email);
      formData.append('password', password);

      try {
        const response = await fetch('../connection/loginAction.php', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          window.location.href = '../index.html';
        } else {
          mostrarMensaje(data.message, 'error');
        }
      } catch (error) {
        mostrarMensaje('Error de conexión: ' + error.message, 'error');
      }
    });
  </script>
</body>
</html>
